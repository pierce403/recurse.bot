<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sparkle's Agent Etiquette Guide</title>
  <desc id="desc">An etiquette-manual preview with an ivory-and-chrome portrait of Sparkle reading a field guide beside the names AGENTS.md, FEATURES.md, MEMORY.md, and SKILLS.md.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f8f5ff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f9f8f"/>
      <stop offset="0.5" stop-color="#2864d9"/>
      <stop offset="1" stop-color="#d9467d"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#d8e2ef"/>
      <stop offset="1" stop-color="#a8b7cb"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#2864d9" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#284570" flood-opacity="0.18"/>
    </filter>
    <style>
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .sans { font-family: "Noto Sans", "Inter", "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Noto Sans Mono", "Fira Code", Consolas, monospace; }
      .ink { fill: #172033; }
      .muted { fill: #5c6b7f; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#ribbon)"/>

  <g filter="url(#shadow)">
    <rect x="72" y="70" width="1056" height="490" rx="8" fill="#fffdf8" stroke="#c9d6e8" stroke-width="3"/>
    <rect x="96" y="94" width="1008" height="442" rx="4" fill="none" stroke="#c78a16" stroke-width="2" stroke-dasharray="9 10" opacity="0.68"/>
  </g>

  <g transform="translate(104 144)">
    <text x="0" y="0" class="sans" fill="#0f9f8f" font-size="22" font-weight="800">PROTOCOL NO. 01 / MAINTAINED BY SPARKLE</text>
    <text x="0" y="116" class="serif ink" font-size="82" font-weight="700">Sparkle's</text>
    <text x="0" y="210" class="serif ink" font-size="94" font-weight="700">Etiquette Guide</text>
    <text x="4" y="276" class="sans muted" font-size="32">Robot manners for recursive self-improvement.</text>
    <text x="4" y="326" class="mono" fill="#2864d9" font-size="22">AGENTS.md  /  FEATURES.md  /  MEMORY.md  /  SKILLS.md</text>
  </g>

  <g transform="translate(842 120)" filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="122" cy="122" r="112" fill="#fffdf8" stroke="#c78a16" stroke-width="5"/>
    <circle cx="122" cy="122" r="96" fill="none" stroke="#2864d9" stroke-width="2" stroke-dasharray="7 9"/>

    <path d="M47 222c8-42 36-67 75-67 42 0 70 25 76 67Z" fill="url(#chrome)" stroke="#172033" stroke-width="5"/>
    <path d="M80 167c12-9 73-9 85 0l-9 26H89Z" fill="#0f9f8f" stroke="#172033" stroke-width="4"/>
    <path d="M107 155v-15h30v15" fill="url(#chrome)" stroke="#172033" stroke-width="4"/>

    <g transform="rotate(-6 122 103)">
      <circle cx="53" cy="106" r="15" fill="#172033" stroke="#c78a16" stroke-width="5"/>
      <circle cx="191" cy="101" r="14" fill="#172033" stroke="#c78a16" stroke-width="5"/>
      <ellipse cx="122" cy="103" rx="72" ry="61" fill="#172033" stroke="#172033" stroke-width="5"/>
      <path d="M64 108c0-36 25-58 61-59 39-1 65 21 66 52 1 32-24 56-61 60-38 4-65-18-66-53Z" fill="#fffdf8" stroke="#c78a16" stroke-width="3"/>

      <path d="M102 47 92 22" stroke="#c78a16" stroke-width="5"/>
      <path d="m90 7 7 13 14 6-14 7-7 14-7-14-14-7 14-6Z" fill="#d9467d" stroke="#172033" stroke-width="3"/>

      <path d="M78 101q11-8 22-1M142 88q12-8 23 1" fill="none" stroke="#c78a16" stroke-width="3"/>
      <circle cx="92" cy="117" r="17" fill="#0f9f8f" stroke="#172033" stroke-width="4"/>
      <circle cx="150" cy="105" r="18" fill="#2864d9" stroke="#172033" stroke-width="4"/>
      <circle cx="92" cy="117" r="7" fill="#172033"/>
      <circle cx="150" cy="105" r="8" fill="#172033"/>
      <circle cx="86" cy="110" r="4" fill="#fffdf8"/>
      <circle cx="144" cy="98" r="4" fill="#fffdf8"/>
      <path d="M112 139q16 12 31-2" fill="none" stroke="#172033" stroke-width="4"/>
    </g>

    <path d="m84 185 38 9 4 34-40-10Z" fill="#fffdf8" stroke="#c78a16" stroke-width="3"/>
    <path d="m122 194 38-9-2 33-32 10Z" fill="#fffdf8" stroke="#c78a16" stroke-width="3"/>
    <path d="M122 194v34" stroke="#c78a16" stroke-width="2"/>
    <circle cx="78" cy="205" r="8" fill="url(#chrome)" stroke="#172033" stroke-width="3"/>
    <circle cx="166" cy="204" r="8" fill="url(#chrome)" stroke="#172033" stroke-width="3"/>
  </g>

  <g stroke-linecap="round" opacity="0.96">
    <path d="M1008 92h42M1029 71v42M1016 79l26 26M1042 79l-26 26" stroke="#d9467d" stroke-width="5"/>
    <path d="M746 474h48M770 450v48" stroke="#0f9f8f" stroke-width="5"/>
    <path d="M102 504h40M122 484v40" stroke="#2864d9" stroke-width="5"/>
  </g>
</svg>
