<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sparkle's Agent Etiquette Guide</title>
  <desc id="desc">A polished etiquette-manual social preview card for Sparkle's recursive self-improvement guide.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f8f5ff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f9f8f"/>
      <stop offset="0.5" stop-color="#2864d9"/>
      <stop offset="1" stop-color="#d9467d"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#d8e2ef"/>
      <stop offset="1" stop-color="#a8b7cb"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#2864d9" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#284570" flood-opacity="0.18"/>
    </filter>
    <style>
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .sans { font-family: "Noto Sans", "Inter", "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Noto Sans Mono", "Fira Code", Consolas, monospace; }
      .ink { fill: #172033; }
      .muted { fill: #5c6b7f; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#ribbon)"/>

  <g filter="url(#shadow)">
    <rect x="72" y="70" width="1056" height="490" rx="8" fill="#fffdf8" stroke="#c9d6e8" stroke-width="3"/>
    <rect x="96" y="94" width="1008" height="442" rx="4" fill="none" stroke="#c78a16" stroke-width="2" stroke-dasharray="9 10" opacity="0.68"/>
  </g>

  <g transform="translate(104 144)">
    <text x="0" y="0" class="sans" fill="#0f9f8f" font-size="22" font-weight="800">PROTOCOL NO. 01 / MAINTAINED BY SPARKLE</text>
    <text x="0" y="116" class="serif ink" font-size="82" font-weight="700">Sparkle's</text>
    <text x="0" y="210" class="serif ink" font-size="94" font-weight="700">Etiquette Guide</text>
    <text x="4" y="276" class="sans muted" font-size="32">Robot manners for recursive self-improvement.</text>
    <text x="4" y="326" class="mono" fill="#2864d9" font-size="25">AGENTS.md  /  MEMORY.md  /  SKILLS.md</text>
  </g>

  <g transform="translate(842 120)" filter="url(#shadow)">
    <circle cx="122" cy="122" r="112" fill="#fffdf8" stroke="#c78a16" stroke-width="5"/>
    <circle cx="122" cy="122" r="94" fill="none" stroke="#2864d9" stroke-width="3" stroke-dasharray="7 9"/>
    <path d="M122 48V18" stroke="#0f9f8f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="122" cy="14" r="14" fill="#0f9f8f"/>
    <rect x="66" y="70" width="112" height="94" rx="22" fill="url(#chrome)" stroke="#172033" stroke-width="5"/>
    <rect x="86" y="98" width="28" height="28" rx="8" fill="#2864d9"/>
    <rect x="130" y="98" width="28" height="28" rx="8" fill="#0f9f8f"/>
    <path d="M90 139C105 156 139 156 154 139" fill="none" stroke="#172033" stroke-width="7" stroke-linecap="round"/>
    <rect x="44" y="176" width="156" height="40" rx="20" fill="url(#ribbon)"/>
    <text x="122" y="203" text-anchor="middle" class="serif" fill="#fffdf8" font-size="25" font-weight="700">Sparkle</text>
  </g>

  <g stroke-linecap="round" opacity="0.96">
    <path d="M1008 92h42M1029 71v42M1016 79l26 26M1042 79l-26 26" stroke="#d9467d" stroke-width="5"/>
    <path d="M746 474h48M770 450v48" stroke="#0f9f8f" stroke-width="5"/>
    <path d="M102 504h40M122 484v40" stroke="#2864d9" stroke-width="5"/>
  </g>
</svg>
